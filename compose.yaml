services:
  postgres:
    profiles: [tools, legacy-recovery]
    image: postgres:17-bookworm
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

  minio:
    profiles: [legacy-recovery]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file: .env
    command: ["server", "/data"]
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: "no"

volumes:
  postgres-data:
  minio-data:
