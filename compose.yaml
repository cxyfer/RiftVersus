services:
  app:
    image: ${RIFTVERSUS_IMAGE:-riftversus:local}
    build:
      context: .
      target: production
    env_file: .env
    command: ["serve"]
    init: true
    ports:
      - "${RIFTVERSUS_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  sync:
    image: ${RIFTVERSUS_IMAGE:-riftversus:local}
    build:
      context: .
      target: production
    env_file: .env
    command: ["sync"]
    init: true
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "node", "apps/server/dist/cli.js", "sync-health"]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: ${RIFTVERSUS_IMAGE:-riftversus:local}
    build:
      context: .
      target: production
    env_file: .env
    command: ["migrate"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file: .env
    command: ["server", "/data"]
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
